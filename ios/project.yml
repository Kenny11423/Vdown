name: Vdown
options:
  bundleIdPrefix: com.kenny
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    AD_HOC_CODE_SIGNING_ALLOWED: YES
    SWIFT_VERSION: "5.0"

targets:
  Vdown:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Vdown
    settings:
      base:
        PRODUCT_NAME: Vdown
        PRODUCT_BUNDLE_IDENTIFIER: com.kenny.vdown
        INFOPLIST_FILE: Vdown/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
