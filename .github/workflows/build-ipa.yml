name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build Application (.app)
        run: |
          xcodebuild build \
            -project ios/Vdown.xcodeproj \
            -scheme Vdown \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p ios/build/Payload
          cp -r ios/build/DerivedData/Build/Products/Release-iphoneos/Vdown.app ios/build/Payload/
          cd ios/build
          zip -r -9 Vdown.ipa Payload
          shasum -a 256 Vdown.ipa > Vdown.ipa.sha256
          echo "=== Build Completed ==="
          ls -lh Vdown.ipa
          cat Vdown.ipa.sha256

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vdown-iOS-IPA
          path: |
            ios/build/Vdown.ipa
            ios/build/Vdown.ipa.sha256
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ipa-build-${{ github.run_number }}
          name: Vdown iOS v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## Vdown for iOS (Unsigned .ipa)
            Automated build from commit `${{ github.sha }}`.

            ### Installation Instructions:
            - **TrollStore** (Recommended for iOS 14.0 - 17.0): Open `Vdown.ipa` in TrollStore. Installs permanently with full entitlements and no revokes.
            - **AltStore / SideStore**: Import `Vdown.ipa` to sign with your free Apple ID.
            - **Sideloadly**: Sideload from your Mac or Windows PC.
            - **Scarlet / LiveContainer**: Open and run directly.

            ### Features:
            - Direct video & audio download (MP4 / MP3).
            - Quality selection (1080p, 720p, 480p, 360p).
            - Built-in Browser / Sniffer to capture video streams from protected sites.
            - Built-in video player & share sheet.
            - Save directly to iOS Camera Roll (Photos) and Files app (`On My iPhone -> Vdown`).
          files: |
            ios/build/Vdown.ipa
            ios/build/Vdown.ipa.sha256
